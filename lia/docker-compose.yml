version: '3.9'

services:
  daemon:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install fastapi uvicorn && uvicorn daemon.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      LIA_HOST: 0.0.0.0
      LIA_PORT: 8000
      LIA_LOG_LEVEL: INFO

  ui:
    image: node:20-alpine
    working_dir: /app/ui
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
